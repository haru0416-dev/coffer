# cargo-deny — supply-chain gate for coffer.
# Run locally with `cargo deny check`; enforced in CI (.github/workflows/ci.yml) on PR/push + weekly.

[advisories]
version = 2
# RustSec advisory DB: fail on yanked crates; known vulnerabilities are denied by default (v2).
yanked = "deny"
ignore = []

[licenses]
version = 2
# coffer is Apache-2.0; its dependency tree is uniformly permissive. Allow that set explicitly so a
# new dependency carrying a copyleft/unknown license fails CI for a deliberate review.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]

[bans]
# Duplicate versions are a warning (transitive churn), not a hard failure.
multiple-versions = "warn"

[sources]
# Only crates.io and explicitly-listed git sources are allowed.
unknown-registry = "deny"
unknown-git = "deny"
