[package]
name = "coffer-mcp"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "MCP server exposing coffer's digest / predicate-query / retrieve over agent tool-output."

[[bin]]
name = "coffer-mcp"
path = "src/main.rs"

[dependencies]
coffer-core = { path = "../coffer-core" }
coffer-cas = { path = "../coffer-cas", features = ["sqlite"] }
coffer-tokenizer = { path = "../coffer-tokenizer" }
rmcp = { version = "1.7", features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "process", "time"] }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
