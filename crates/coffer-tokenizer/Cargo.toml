[package]
name = "coffer-tokenizer"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Token counting with a seam for per-model parity (the headline number depends on this)."

[features]
default = []
# Offline, byte-exact OpenAI counting. Off by default so the Stage 0 build stays light;
# Claude/Gemini parity is API-backed and lands later (no offline tokenizer exists for Claude 3+).
tiktoken = ["dep:tiktoken-rs"]

[dependencies]
tiktoken-rs = { workspace = true, optional = true }

[lints]
workspace = true
