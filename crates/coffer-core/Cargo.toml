[package]
name = "coffer-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Byte-exact, reversible compression of agent tool-output, plus an exact compute-digest over the offloaded bytes."

[dependencies]
coffer-cas = { path = "../coffer-cas" }
coffer-tokenizer = { path = "../coffer-tokenizer" }
# A re-executable exactness receipt (the `receipt` module) is serde-serialized so a third party can
# persist it and re-verify in a fresh process; the engine's JSON model stays serde_json.
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[features]
# Count with the real OpenAI o200k_base tokenizer (instead of the chars/4 heuristic) — used by the
# `filter` example so headline token numbers come from the model's own tokenizer, not an estimate.
tiktoken = ["coffer-tokenizer/tiktoken"]

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
