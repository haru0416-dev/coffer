[package]
name = "coffer-wrap"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Wrap any stdio MCP server: oversized tool results become byte-exact, SHA-256-verified CAS handles with exact, provenance-backed query tools — instead of context floods or hard failures."

[[bin]]
name = "coffer-wrap"
path = "src/main.rs"

[dependencies]
coffer-core = { path = "../coffer-core" }
coffer-cas = { path = "../coffer-cas", features = ["sqlite"] }
coffer-tokenizer = { path = "../coffer-tokenizer" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "io-std", "process", "sync"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["time", "test-util"] }

[lints]
workspace = true
