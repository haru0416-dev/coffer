name: release

# Tag-driven binary releases: push a `v*` tag and each platform job builds the three
# binaries, packages them with LICENSE/README, and uploads to the GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Create the release (with generated notes) exactly ONCE, before the platform matrix:
  # when every matrix job carried generate_release_notes, each one appended another copy
  # of the notes to the release body.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # macos-13 (the last x86_64 macOS runner) queues indefinitely; build the
          # x86_64 slice by cross-compiling on the arm64 runner instead — Apple's
          # toolchain supports it out of the box.
          - os: macos-14
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Build each binary PER PACKAGE, never --workspace: a workspace build unifies
      # cargo features across every member, and coffer-eval's always-on `tiktoken`
      # feature would leak ~0.5 MB of unused tokenizer vocabulary into every binary
      # (measured: coffer-wrap 3.8 MB per-package vs 4.3 MB workspace-built).
      - name: Build
        run: |
          cargo build --release --locked --target ${{ matrix.target }} -p coffer-wrap
          cargo build --release --locked --target ${{ matrix.target }} -p coffer-mcp
          cargo build --release --locked --target ${{ matrix.target }} -p coffer-proxy
        shell: bash

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="coffer-v${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          ext=""
          if [[ "${{ matrix.os }}" == windows-* ]]; then ext=".exe"; fi
          for bin in coffer-wrap coffer-mcp coffer-proxy; do
            cp "target/${{ matrix.target }}/release/${bin}${ext}" "dist/${name}/"
          done
          cp LICENSE README.md "dist/${name}/"
          cd dist
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            7z a "${name}.zip" "${name}" > /dev/null
            sha256sum "${name}.zip" > "${name}.zip.sha256"
          else
            tar czf "${name}.tar.gz" "${name}"
            shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
          fi

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz* dist/*.zip* --clobber
